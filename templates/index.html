<!DOCTYPE html>
<html lang="te">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ brand_name }}</title>
  <link rel="icon" type="image/svg+xml" href="{{ subpath }}/static/images/favicon.svg?v=2">
  <link rel="stylesheet" href="{{ subpath }}/static/css/app.css?v=7">
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>{{ brand_name }} <span class="te">జాతక చక్రాలు</span></h1>
    <div class="lang">
      <button data-lang="telugu" class="on">తెలుగు</button>
      <button data-lang="english">English</button>
    </div>
  </header>

  <nav class="tabs" id="tabs">
    <button data-tab="jathakam" class="on" data-te="జాతక చక్రం" data-en="Birth Chart">జాతక చక్రం</button>
    <button data-tab="grahas" data-te="గ్రహ స్థితి / భావ" data-en="Planets / Bhava">గ్రహ స్థితి / భావ</button>
    <button data-tab="vargas" data-te="షోడశ వర్గ" data-en="16 Vargas">షోడశ వర్గ</button>
    <button data-tab="dasha" data-te="వింశోత్తరి దశ" data-en="Dasha">వింశోత్తరి దశ</button>
    <button data-tab="ashtaka" data-te="అష్టకవర్గ" data-en="Ashtakavarga">అష్టకవర్గ</button>
    <button data-tab="phalitam" data-te="ఫలితాలు" data-en="Predictions">ఫలితాలు</button>
    <button data-tab="parihara" data-te="పరిహారాలు" data-en="Remedies">పరిహారాలు</button>
    <button data-tab="gochara" data-te="గోచారం" data-en="Transits">గోచారం</button>
    <button data-tab="match" data-te="పొంతన" data-en="Match Making">పొంతన</button>
  </nav>

  <!-- Birth details form (shared by all tabs except Match) -->
  <section class="card" id="birthCard">
    <form id="birthForm" class="birth-form"></form>
  </section>

  <div id="msg" class="msg" hidden></div>

  <main>
    <section class="tab on" id="tab-jathakam"></section>
    <section class="tab" id="tab-grahas"></section>
    <section class="tab" id="tab-vargas"></section>
    <section class="tab" id="tab-dasha"></section>
    <section class="tab" id="tab-ashtaka"></section>
    <section class="tab" id="tab-phalitam"></section>
    <section class="tab" id="tab-parihara"></section>
    <section class="tab" id="tab-gochara"></section>
    <section class="tab" id="tab-match">
      <div class="match-forms">
        <div class="card"><h3 data-te="వరుడు" data-en="Boy">వరుడు</h3><form id="boyForm" class="birth-form"></form></div>
        <div class="card"><h3 data-te="వధువు" data-en="Girl">వధువు</h3><form id="girlForm" class="birth-form"></form></div>
      </div>
      <div class="center"><button id="matchBtn" class="primary" data-te="పొంతన చూడండి" data-en="Check Match">పొంతన చూడండి</button></div>
      <div id="matchOut"></div>
    </section>
  </main>

  {% if developer_credit %}<footer>{{ developer_credit }}</footer>{% endif %}
</div>

<template id="birthFields">
  <label><span data-te="పేరు" data-en="Name">పేరు</span><input name="name" required></label>
  <label><span data-te="తేదీ" data-en="Date">తేదీ</span><input type="date" name="date" required></label>
  <label><span data-te="సమయం" data-en="Time">సమయం</span><input type="time" step="1" name="time" required></label>
  <label><span data-te="దేశం" data-en="Country">దేశం</span><select name="country"></select></label>
  <label><span data-te="నగరం" data-en="City">నగరం</span><select name="city"></select></label>
  <details class="manual"><summary data-te="అక్షాంశ / రేఖాంశం (ఐచ్ఛికం)" data-en="Lat / Lon (optional)">అక్షాంశ / రేఖాంశం (ఐచ్ఛికం)</summary>
    <label>Lat<input name="lat" type="number" step="0.0001"></label>
    <label>Lon<input name="lon" type="number" step="0.0001"></label>
    <label>TZ<input name="iana_tz" placeholder="Asia/Kolkata"></label>
  </details>
</template>

<script>window.SUBPATH = "{{ subpath }}";</script>
<script src="{{ subpath }}/static/js/app.js?v=7"></script>
</body>
</html>
